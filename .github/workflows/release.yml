name: Release

# Tag a release with: git tag v0.1.0 && git push origin v0.1.0
# Produces: whiteblock-app-<tag>.zip (standalone server, no install) and
# whiteblock-docker-<tag>.tar.gz (docker save, :latest tag inside).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # Pinned by SHA (checkout v5); bump with Dependabot.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so release notes see real tags, not a depth-1 stub.
          fetch-depth: 0

      - name: Set up Node
        # Pinned by SHA (setup-node v5); bump with Dependabot.
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Package standalone app zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cd .next/standalone
          zip -qr "whiteblock-app-${TAG}.zip" server.js node_modules public .next package.json
          mv "whiteblock-app-${TAG}.zip" ../../
          cd ../..

      - name: Build and save Docker image
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker build -t "whiteblock:${TAG}" -t whiteblock:latest .
          docker save whiteblock:latest | gzip > "whiteblock-docker-${TAG}.tar.gz"

      - name: Write release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          {
            echo "## One-line Docker install"
            echo '```bash'
            echo "curl -sL https://github.com/NemesTom/whiteblock/releases/latest/download/whiteblock-docker.tar.gz \\"
            echo "  | docker load && docker run -d --name whiteblock --restart unless-stopped -p 8099:8099 whiteblock"
            echo '```'
            echo ""
            echo "While this repo is private, add an auth header with a classic PAT (read access):"
            echo '```bash'
            echo 'curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" ...'
            echo '```'
            echo ""
            echo "Standalone zip alternative: unzip \`whiteblock-app-${TAG}.zip\` and run \`PORT=8099 node server.js\` (Node 22+, no install)."
            echo ""
            echo "## Changes"
            if [ -n "$PREV" ]; then
              git log --oneline "${PREV}..HEAD"
            else
              git log --oneline -20
            fi
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --title "Whiteblock ${TAG}" \
            --notes-file release-notes.md \
            "whiteblock-app-${TAG}.zip" \
            "whiteblock-docker-${TAG}.tar.gz"
